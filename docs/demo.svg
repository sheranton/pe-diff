  <text x="22" y="439.0" textLength="405.4" lengthAdjust="spacing" class="l" style="animation-delay: 2.98s" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">1 header, 2 section, 1 import, 1 export change(s)</tspan></text>
