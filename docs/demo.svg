<svg xmlns="http://www.w3.org/2000/svg" width="640" height="522" viewBox="0 0 640.0 522.5" role="img" aria-label="pe-diff: what changed between two builds">
  <style>
    text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13.2px; }
  .l { opacity: 0; animation: show 0.01s steps(1, end) forwards; }
  @keyframes show { to { opacity: 1; } }
  @keyframes hide { to { opacity: 0; } }
  .cursor { animation: blink 1.06s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes type0 { to { transform: translateX(310.1px); } }
  .ty0 { animation: type0 1.17s steps(39, end) 0.60s both; }
  .cu0 { animation: hide 0.01s steps(1, end) 1.77s forwards; }
  @keyframes type20 { to { transform: translateX(55.6px); } }
  .ty20 { animation: type20 0.40s steps(7, end) 3.62s both; }
  .cu20 { animation: hide 0.01s steps(1, end) 4.02s forwards; }
  @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cover { display: none; } g[class^="ty"], .cursor { animation: none; } }
  </style>
