name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows (MSVC), os: windows-latest }
          - { name: Linux (GCC), os: ubuntu-latest }
          - { name: macOS (Clang), os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  mingw:
    name: MinGW-w64 (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_SYSTEM_NAME=Windows \
                -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_BUILD_TYPE=Release
          cmake --build build
